name: Refresh semantic profiles

# Rebuilds src/data/semantic_profiles.json from OpenAlex monthly (journals +
# conferences) so the methodology fingerprints / submission-fit scorecard stay
# current. Commits only when the file actually changes.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of each month, 06:00 UTC
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write

concurrency:
  group: refresh-semantic-profiles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Regenerate semantic profiles
        run: python scripts/update_semantic_profiles.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/semantic_profiles.json; then
            echo "No changes to semantic_profiles.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/semantic_profiles.json
          git commit -m "chore: monthly refresh of semantic_profiles (journals + conferences)"
          git push
