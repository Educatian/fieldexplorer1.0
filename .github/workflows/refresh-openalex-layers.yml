name: Refresh OpenAlex layers

on:
  schedule:
    - cron: '0 7 2-4 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-openalex-layers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Restore referenced-works cache
        uses: actions/cache/restore@v4
        with:
          path: src/data/_ref_meta_cache.json
          key: openalex-refs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: openalex-refs-
      - name: Refresh incomplete layers independently
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_openalex_layers.py --report refresh-report.json
      - name: Save referenced-works cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/data/_ref_meta_cache.json
          key: openalex-refs-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit only completed layers
        if: always()
        run: |
          # The runner restores failed outputs; never stage unrelated files.
          [ -f refresh-report.json ] || { echo "Missing refresh report"; exit 1; }
          files=$(python -c "import json; r=json.load(open('refresh-report.json')); print(' '.join(v['file'] for v in r['layers'].values() if v['status']=='refreshed'))")
          [ -z "$files" ] && { echo "No completed changes to commit."; exit 0; }
          if git diff --quiet -- $files; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- $files
          git commit -m "chore: refresh completed OpenAlex layers"
          git pull --rebase origin main
          git push
      - name: Save per-layer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: refresh-report.json
          if-no-files-found: error
      - name: Report incomplete refresh as a failure
        if: always() && steps.refresh.outcome != 'success'
        run: |
          echo "One or more layers failed. Last-good data was preserved; the next run retries only incomplete layers."
          exit 1
