<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>FieldExplorer lecture</title><link rel="icon" href="/favicon.png" type="image/png">
<style>
html,body{margin:0;height:100%;background:#000;color:#e6e9f0;font:13px/1.4 'Inter',Arial,sans-serif}
#embed{display:flex;flex-direction:column;height:100%}
.stage{flex:1;min-height:0;position:relative;background:#000}
.stage video,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;padding:7px 12px;background:#0b0e14;border-top:1px solid #2c3344}
.bar .title{overflow:hidden;text-overflow:ellipsis;color:#c9d1e3}
.bar .title{white-space:nowrap;min-width:0}.bar .links{display:flex;flex-wrap:wrap;gap:4px 12px;flex-shrink:0}
.bar a{color:#a5b4fc;text-decoration:none;display:inline-flex;align-items:center;min-height:32px}.bar a:hover{text-decoration:underline}.bar a:focus-visible{outline:2px solid #c7d2fe;outline-offset:3px}
@media(max-width:700px){.bar{align-items:stretch;flex-direction:column;gap:3px}.bar .links{justify-content:space-between;flex-shrink:1}.bar .title{font-size:12px}}
.missing{margin:auto;padding:24px;text-align:center}.missing a{color:#a5b4fc}
</style>
<script src="catalog.js?v=embed-1" defer></script><script src="embed.js?v=embed-1" defer></script></head>
<body><main id="embed" aria-live="polite"></main></body></html>
